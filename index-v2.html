<style>
/* ============================================================
   TOKENS — 全站只用這裡的數值
   ============================================================ */
:root{
  /* 色階：單色系統，顏色只從作品圖來 */
  --bg:#08080a;
  --surface:#101013;
  --fg:#f2f2f4;
  --muted:#8b8b93;
  --faint:#4a4a52;
  --line:#1c1c21;
  --accent:#e8452b;          /* 極少量使用：hover / 焦點 */

  /* 間距刻度 */
  --s1:8px; --s2:16px; --s3:24px; --s4:48px; --s5:96px; --s6:160px;

  /* 版心與邊界 */
  --pad:clamp(20px, 5vw, 72px);
  --maxw:1440px;

  /* 動態：兩條曲線就夠了 */
  --exp:cubic-bezier(0.16, 1, 0.3, 1);      /* 進場 / 展開：乾脆的煞車 */
  --smooth:cubic-bezier(0.4, 0, 0.2, 1);    /* 狀態切換：hover 之類 */
  --t-fast:.28s;
  --t-mid:.55s;
  --t-slow:.9s;
}

*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:'Inter Tight','Noto Sans TC',-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;
  font-weight:400;line-height:1.5;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--pad)}

/* ============================================================
   NAV — 細，安靜，底下一條捲動進度線
   ============================================================ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--s2) var(--pad);
  background:rgba(8,8,10,.55);
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--line);
}
.nav .brand{font-weight:600;letter-spacing:.14em;font-size:13px}
.nav .contact{font-size:11px;letter-spacing:.16em;color:var(--muted);transition:color var(--t-fast) var(--smooth)}
.nav .contact:hover{color:var(--fg)}

/* 捲動進度：CSS scroll-driven animation。不支援的瀏覽器就看不到，不影響任何東西 */
.progress{
  position:absolute;left:0;bottom:-1px;height:1px;width:100%;
  background:var(--fg);transform-origin:0 50%;transform:scaleX(0);
  animation:progressGrow linear both;
  animation-timeline:scroll(root block);
}
@keyframes progressGrow{to{transform:scaleX(1)}}

/* ============================================================
   HERO — 招牌動態就在這裡：影像收縮 + 標題遮罩上推
   ============================================================ */
.hero{padding-top:52px}
.hero-media{
  position:relative;width:100%;height:min(78vh,760px);
  overflow:hidden;background:var(--surface);
}
.hero-media img{
  width:100%;height:100%;object-fit:cover;
  transform:scale(1.09);
  animation:heroSettle 1.6s var(--exp) .1s both;
}
@keyframes heroSettle{to{transform:scale(1)}}

/* 捲動時的緩慢視差（同樣是漸進增強） */
@supports (animation-timeline: view()){
  .hero-media img{
    animation:heroSettle 1.6s var(--exp) .1s both, heroDrift linear both;
    animation-timeline:auto, view();
    animation-range:normal, contain 0% cover 100%;
  }
  @keyframes heroDrift{to{transform:scale(1.06) translateY(6%)}}
}

.hero-body{padding-block:var(--s4) var(--s5)}
.hero h1{
  font-size:clamp(52px,11vw,150px);line-height:.86;margin:0;
  letter-spacing:-.035em;font-weight:600;text-transform:uppercase;
}
.mask{overflow:hidden;display:block}
.mask > *{display:block;transform:translateY(105%);animation:maskUp 1.1s var(--exp) both}
.hero h1 .mask > *{animation-delay:.35s}
.hero-sub .mask > *{animation-delay:.5s}
.hero-meta .mask > *{animation-delay:.62s}
@keyframes maskUp{to{transform:translateY(0)}}

.hero-sub{
  margin-top:var(--s3);font-size:clamp(13px,1.3vw,15px);
  letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500;
}
.hero-meta{
  margin-top:var(--s4);padding-top:var(--s2);border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:var(--s3) var(--s5);
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
}
.hero-meta b{display:block;color:var(--muted);font-weight:500;margin-top:6px;letter-spacing:.1em}

/* ============================================================
   SECTION HEADER — 小標籤 + 大字，靠左，不置中、不裁切
   ============================================================ */
.sec{padding-block:var(--s5)}
.sec-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);
  padding-bottom:var(--s3);margin-bottom:var(--s4);
  border-bottom:1px solid var(--line);
}
.sec-label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.sec-title{
  font-size:clamp(34px,7.5vw,104px);line-height:.9;margin:0;
  letter-spacing:-.035em;font-weight:600;text-transform:uppercase;
}

/* ============================================================
   WORK GRID
   ============================================================ */
.work-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s5) var(--s4)}
.card{display:block;position:relative}
.card.featured{grid-column:1 / -1}

.thumb{
  position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;
  background:var(--surface);
  clip-path:inset(0 0 100% 0);
  transition:clip-path var(--t-slow) var(--exp) var(--d,0s);
}
.card.featured .thumb{aspect-ratio:2.2/1}
.thumb img{
  width:100%;height:100%;object-fit:cover;
  transform:scale(1.14);
  transition:transform var(--t-slow) var(--exp) var(--d,0s);
}
.card.top-crop .thumb img{object-position:top}
.card.in .thumb{clip-path:inset(0 0 0 0)}
.card.in .thumb img{transform:scale(1)}

/* hover：影像微推近 + 箭頭位移。文字不壓在圖上，所以不會跟海報自帶的字打架 */
.card:hover .thumb img{transform:scale(1.045);transition-duration:var(--t-slow);transition-delay:0s}
.thumb::after{
  content:"";position:absolute;inset:0;background:rgba(8,8,10,.18);
  opacity:1;transition:opacity var(--t-mid) var(--smooth);
}
.card:hover .thumb::after{opacity:0}

/* hover 影片預覽（資料裡有 preview 欄位才會出現） */
.thumb video{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity var(--t-mid) var(--smooth);
}
.card.playing video{opacity:1}

.card-info{
  display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s2);
  margin-top:var(--s2);padding-top:var(--s2);border-top:1px solid var(--line);
  opacity:0;transform:translateY(14px);
  transition:opacity var(--t-mid) var(--smooth) calc(var(--d,0s) + .22s),
             transform var(--t-mid) var(--exp) calc(var(--d,0s) + .22s);
}
.card.in .card-info{opacity:1;transform:none}
.card-title{
  font-size:clamp(16px,1.5vw,21px);font-weight:500;letter-spacing:-.01em;line-height:1.3;
  transition:color var(--t-fast) var(--smooth);
}
.card:hover .card-title{color:#fff}
.card-role{
  margin-top:6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
}
.card-idx{
  font-size:11px;letter-spacing:.14em;color:var(--faint);white-space:nowrap;
  display:flex;align-items:center;gap:var(--s1);
}
.card-idx .arrow{display:inline-block;transition:transform var(--t-mid) var(--exp)}
.card:hover .card-idx .arrow{transform:translate(3px,-3px)}

.hidden-proj{display:none}

/* LOAD MORE */
.more-row{margin-top:var(--s5);display:flex;justify-content:center}
.more-btn{
  position:relative;overflow:hidden;cursor:pointer;background:none;
  border:1px solid var(--line);color:var(--muted);
  padding:16px 40px;border-radius:999px;
  font:inherit;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  transition:color var(--t-mid) var(--smooth),border-color var(--t-mid) var(--smooth);
}
.more-btn::before{
  content:"";position:absolute;inset:0;background:var(--fg);
  transform:translateY(101%);transition:transform var(--t-mid) var(--exp);z-index:-1;
}
.more-btn{isolation:isolate;z-index:0}
.more-btn:hover{color:var(--bg);border-color:var(--fg)}
.more-btn:hover::before{transform:translateY(0)}

/* ============================================================
   BORING STUFF
   ============================================================ */
.boring-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--s4) var(--s3)}
.boring-card .thumb{aspect-ratio:1/1}
.boring-card .card-title{font-size:14px;letter-spacing:.14em;text-transform:uppercase}

/* ============================================================
   DEVELOP — 兩個入口保留各自的世界觀，只對齊格線
   ============================================================ */
.portals{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:var(--s3)}
.portal{display:block;position:relative;overflow:hidden;height:170px;text-decoration:none}
.portal-body{
  position:relative;z-index:2;height:100%;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
}

/* — SOP：粉紅玻璃 */
.sop-btn{
  border-radius:24px;
  background:linear-gradient(135deg,rgba(255,192,203,.15),rgba(255,105,180,.1));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,182,193,.3);
  box-shadow:0 8px 32px rgba(255,105,180,.1);
  transition:transform var(--t-mid) var(--exp),box-shadow var(--t-mid) var(--smooth),
             border-color var(--t-mid) var(--smooth),background var(--t-mid) var(--smooth);
}
.sop-btn:hover{
  transform:translateY(-4px);
  box-shadow:0 18px 50px rgba(255,105,180,.28);
  border-color:rgba(255,182,193,.6);
  background:linear-gradient(135deg,rgba(255,192,203,.25),rgba(255,105,180,.2));
}
.sop-title{font-size:clamp(22px,2.4vw,30px);font-weight:700;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5);letter-spacing:.04em}
.sop-subtitle{
  margin-top:var(--s1);font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;
  background:linear-gradient(90deg,#fff,#ffe4e1);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:breathe 3s infinite ease-in-out;
}
@keyframes breathe{0%,100%{opacity:.65}50%{opacity:1}}
.sop-bubbles{position:absolute;inset:0;z-index:1;pointer-events:none}
.sop-bubble{
  position:absolute;bottom:-60px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.4),rgba(255,182,193,.1));
  border:1px solid rgba(255,192,203,.4);animation:floatUp linear infinite;
}
@keyframes floatUp{0%{transform:translateY(0) scale(1);opacity:0}10%{opacity:.5}100%{transform:translateY(-230px) scale(1.1);opacity:0}}

/* — WTS：BIOS 終端機 */
.wts-btn{
  border-radius:4px;background:#000;border:1px solid #1c7a0a;
  box-shadow:inset 0 0 20px rgba(57,255,20,.08);
  transition:transform var(--t-mid) var(--exp),border-color var(--t-mid) var(--smooth),box-shadow var(--t-mid) var(--smooth);
}
.wts-btn:hover{
  transform:translateY(-4px);border-color:#39ff14;
  box-shadow:inset 0 0 25px rgba(57,255,20,.25),0 14px 40px rgba(57,255,20,.18);
}
.wts-btn .portal-body{font-family:'Courier New',monospace}
.wts-title{font-size:clamp(19px,2vw,26px);font-weight:700;color:#39ff14;text-shadow:0 0 8px rgba(57,255,20,.6);letter-spacing:.04em}
.wts-subtitle{margin-top:var(--s1);font-size:13px;color:#1c7a0a;letter-spacing:.15em;text-transform:uppercase}
.wts-btn .caret{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ============================================================
   CONTACT / FOOTER
   ============================================================ */
.mail{
  display:inline-block;font-size:clamp(22px,4.5vw,58px);font-weight:500;letter-spacing:-.025em;
  position:relative;padding-bottom:6px;
}
.mail::after{
  content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:currentColor;
  transform:scaleX(0);transform-origin:100% 50%;transition:transform var(--t-mid) var(--exp);
}
.mail:hover::after{transform:scaleX(1);transform-origin:0 50%}
.mail:hover{color:var(--accent)}

.footer{
  margin-top:var(--s5);padding:var(--s3) 0 var(--s4);border-top:1px solid var(--line);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:var(--s2);
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
}

.to-top{
  position:fixed;right:var(--s3);bottom:var(--s3);z-index:90;
  width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(16,16,19,.7);backdrop-filter:blur(10px);
  border:1px solid var(--line);color:var(--muted);font-size:12px;
  opacity:0;pointer-events:none;transform:translateY(10px);
  transition:opacity var(--t-mid) var(--smooth),transform var(--t-mid) var(--exp),color var(--t-fast) var(--smooth);
}
.to-top.show{opacity:1;pointer-events:auto;transform:none}
.to-top:hover{color:var(--fg)}

/* 通用區塊進場 */
.rise{opacity:0;transform:translateY(20px);
  transition:opacity var(--t-mid) var(--smooth),transform var(--t-mid) var(--exp)}
.rise.in{opacity:1;transform:none}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:860px){
  .work-grid{grid-template-columns:1fr;gap:var(--s4)}
  .card.featured .thumb{aspect-ratio:16/9}
  .sec{padding-block:var(--s4)}
  .hero-media{height:62vh}
  .hero-meta{gap:var(--s3) var(--s4)}
}

/* ============================================================
   REDUCED MOTION
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
  .thumb{clip-path:none}
  .thumb img{transform:none}
  .mask > *{transform:none}
}
</style>
</head>

];

const boring = [
  {name:'SCREEAAM', thumb:'https://i.postimg.cc/JH42Z219/A.png', url:'https://www.instagram.com/p/C60CLmAPdUy/?igsh=MW12bmYxNm42NXF1bg=='},
  {name:"RIDER'S ON THE STONE", thumb:'https://i.postimg.cc/dLfxZ6zY/B.png', url:'https://www.instagram.com/reel/CzbiKlSPUpA/?igsh=MThjdnF6NmR1aGNvZg=='},
  {name:'PINKCHAIN', thumb:'https://i.postimg.cc/56rRQgDD/C.png', url:'https://www.instagram.com/p/C5znpsAP3De/?igsh=bW55bnJ0bG9pZ3J1'}
];

const email = 'truemore1309@gmail.com';
const INITIAL = 6;   // 先顯示幾件

// ===== Hero =====
document.getElementById('hero-img').src = hero.image;
document.getElementById('hero-title').textContent = hero.title;
document.getElementById('hero-sub').textContent = hero.subtitle;
document.getElementById('meta-count').textContent = String(projects.length).padStart(2,'0') + ' Projects';

// ===== Reveal（IntersectionObserver + stagger）=====
const io = new IntersectionObserver(entries=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
},{threshold:.12, rootMargin:'0px 0px -8% 0px'});

function observe(el){ io.observe(el); }
document.querySelectorAll('.rise').forEach(observe);

// ===== Cards =====
function buildCard(item, i, opts){
  const a = document.createElement('a');
  a.className = 'card' + (opts.className ? ' ' + opts.className : '');
  if((item.name||'').includes('金馬')) a.classList.add('top-crop');
  a.href = item.url || '#';
  if(item.url){ a.target = '_blank'; a.rel = 'noopener'; }
  a.style.setProperty('--d', ((i % 2) * 0.09) + 's');   // 同一列錯開 90ms

  const thumb = item.thumb || ytThumb(item.url) || hero.image;
  a.innerHTML = `
    <div class="thumb">
      <img src="${thumb}" alt="${item.name}" loading="lazy">
      ${item.preview ? `<video src="${item.preview}" muted loop playsinline preload="none"></video>` : ''}
    </div>
    <div class="card-info">
      <div>
        <div class="card-title">${item.name}</div>
        ${opts.role ? `<div class="card-role">${opts.role}</div>` : ''}
      </div>
      <div class="card-idx">${opts.index}<span class="arrow">↗</span></div>
    </div>`;

  if(item.preview){
    const v = a.querySelector('video');
    a.addEventListener('mouseenter', ()=>{ a.classList.add('playing'); v.play().catch(()=>{}); });
    a.addEventListener('mouseleave', ()=>{ a.classList.remove('playing'); v.pause(); v.currentTime = 0; });
  }
  return a;
}

const grid = document.getElementById('work-grid');
projects.forEach((p,i)=>{
  const card = buildCard(p, i, {
    className: i === 0 ? 'featured' : '',
    role: i >= 2 ? 'CG GENERALIST' : (p.role || ''),
    index: String(i+1).padStart(2,'0')
  });
  if(i >= INITIAL){ card.classList.add('hidden-proj'); }
  grid.appendChild(card);
  if(i < INITIAL) observe(card);
});

// ===== Load more =====
const rest = () => grid.querySelectorAll('.hidden-proj');
if(rest().length){
  const btn = document.createElement('button');
  btn.className = 'more-btn';
  btn.textContent = `More Work (${rest().length})`;
  btn.addEventListener('click', ()=>{
    rest().forEach((el,i)=>{
      el.classList.remove('hidden-proj');
      el.style.setProperty('--d', (i * 0.06) + 's');
      requestAnimationFrame(()=> observe(el));
    });
    btn.parentElement.remove();
  });
  document.getElementById('more-row').appendChild(btn);
}

// ===== Boring =====
const bgrid = document.getElementById('boring-grid');
boring.forEach((b,i)=>{
  const card = buildCard(b, i, { className:'boring-card', role:'', index:String(i+1).padStart(2,'0') });
  card.style.setProperty('--d', (i * 0.08) + 's');
  bgrid.appendChild(card);
  observe(card);
});

// ===== Email =====
const mail = document.getElementById('email-link');
mail.href = 'mailto:' + email;
mail.textContent = email;
document.getElementById('nav-mail').href = 'mailto:' + email;

// ===== Back to top =====
const toTop = document.querySelector('.to-top');
let ticking = false;
addEventListener('scroll', ()=>{
  if(ticking) return;
  ticking = true;
  requestAnimationFrame(()=>{
    toTop.classList.toggle('show', scrollY > innerHeight * .8);
    ticking = false;
  });
}, {passive:true});

// ===== SOP bubbles =====
(function(){
  const c = document.getElementById('sop-bubbles');
  if(!c) return;
  for(let i=0;i<18;i++){
    const b = document.createElement('div');
    b.className = 'sop-bubble';
    const size = Math.random()*36 + 10;
    b.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;`
      + `animation-duration:${(Math.random()*5+4).toFixed(1)}s;animation-delay:${(Math.random()*5).toFixed(1)}s`;
    c.appendChild(b);
  }
})();
</script>
