<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WTS — What The Sound</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --fg:#39ff14;
    --fg-dim:#1c7a0a;
    --fg-faint:#0d3d05;
    --amber:#ffb000;
    --danger:#ff3b30;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;padding:0;width:100%;min-height:100%;
    background:var(--bg);color:var(--fg);
    font-family:'VT323','Courier New',monospace;
    font-size:22px;
    -webkit-font-smoothing:none;
  }
  a{color:inherit}

  /* CRT scanline + vignette overlay (static — no blend-mode/animation to keep mobile GPUs happy) */
  #crt{
    position:fixed;inset:0;pointer-events:none;z-index:50;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0.2) 0px, rgba(0,0,0,0.2) 1px, transparent 2px, transparent 4px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.5) 100%);
  }

  .home-btn{
    position:fixed;top:16px;left:16px;z-index:100;
    padding:6px 14px;
    background:#000;
    border:1px solid var(--fg-dim);
    color:var(--fg-dim);
    text-decoration:none;
    font-size:20px;
    letter-spacing:.05em;
    transition:all .15s;
    animation:home-btn-blink 10s ease-in-out infinite;
  }
  .home-btn:hover{border-color:var(--fg);color:var(--fg);box-shadow:0 0 8px var(--fg-dim);animation-play-state:paused}
  /* quiet by default, flashes once near the end of every 10s cycle to catch a passerby's eye */
  @keyframes home-btn-blink{
    0%, 90%, 100%{opacity:1;box-shadow:none;border-color:var(--fg-dim);color:var(--fg-dim)}
    92%, 96%{opacity:.25}
    94%, 98%{opacity:1;box-shadow:0 0 10px var(--fg);border-color:var(--fg);color:var(--fg)}
  }
  @media (prefers-reduced-motion:reduce){
    .home-btn{animation:none}
  }

  .wrap{
    max-width:900px;margin:0 auto;
    padding:70px 20px 40px;
    min-height:100vh;
    display:flex;flex-direction:column;
  }

  .title-bar{
    text-align:center;
    color:var(--fg-dim);
    font-size:18px;
    letter-spacing:.15em;
    border-bottom:1px solid var(--fg-faint);
    padding-bottom:8px;
    margin-bottom:18px;
    text-transform:uppercase;
  }

  .dice-panel{
    border:1px solid var(--fg-faint);
    padding:12px 10px 14px;
    text-align:center;
    margin-bottom:18px;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .dice-panel:hover{border-color:var(--fg-dim)}
  .dice-label{
    color:var(--fg-dim);
    font-size:14px;
    letter-spacing:.15em;
    margin-bottom:6px;
    text-transform:uppercase;
  }
  .dice-face{
    display:inline-block;
    margin:0;
    font-family:'VT323','Courier New',monospace;
    font-size:20px;
    line-height:1.15;
    color:var(--fg);
    text-shadow:0 0 6px var(--fg);
  }
  .dice-face.rolling{animation:diceshake .12s linear infinite}
  @keyframes diceshake{
    0%{transform:translate(0,0) rotate(0deg)}
    25%{transform:translate(-1px,1px) rotate(-2deg)}
    50%{transform:translate(1px,-1px) rotate(2deg)}
    75%{transform:translate(-1px,-1px) rotate(-1deg)}
    100%{transform:translate(0,0) rotate(0deg)}
  }

  .mic-inline{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
    margin-bottom:14px;
  }
  .mic-title{color:var(--fg-dim);font-size:15px;letter-spacing:.1em;text-transform:uppercase}
  #mic-status{color:var(--fg)}
  .mic-readout{
    text-align:center;
    font-size:20px;
    letter-spacing:.05em;
    min-height:1.3em;
    text-shadow:0 0 6px var(--fg);
  }
  .mic-readout:not(:empty){
    margin-top:14px;
    padding-top:10px;
    border-top:1px dashed var(--fg-faint);
  }
  .mic-bar{
    text-align:center;
    font-size:18px;
    color:var(--fg-dim);
    min-height:1.3em;
    white-space:pre;
  }

  .screen{
    border:1px solid var(--fg-dim);
    box-shadow:0 0 20px rgba(57,255,20,0.15) inset;
    padding:20px 20px 16px;
    text-align:center;
    margin-bottom:18px;
    position:relative;
  }

  #chord-display{
    font-size:clamp(56px,14vw,96px);
    line-height:1;
    text-shadow:0 0 8px var(--fg),0 0 20px rgba(57,255,20,0.5);
    letter-spacing:.02em;
    min-height:1.1em;
  }
  #chord-display.blink::after{content:'_';animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  #chord-detail{
    color:var(--fg-dim);
    font-size:18px;
    letter-spacing:.08em;
    margin-top:8px;
    min-height:1.4em;
  }

  #boot-log{
    border:1px solid var(--fg-faint);
    height:150px;
    overflow-y:auto;
    padding:10px 12px;
    font-size:17px;
    color:var(--fg-dim);
    margin-bottom:24px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
  }
  #boot-log .line{opacity:0;animation:fadein .15s forwards}
  @keyframes fadein{to{opacity:1}}
  #boot-log .hl{color:var(--fg)}

  .octave-block{margin-bottom:18px}
  .octave-label{
    color:var(--fg-dim);
    font-size:16px;
    letter-spacing:.15em;
    margin-bottom:6px;
    text-transform:uppercase;
  }
  .note-grid{
    display:grid;
    grid-template-columns:repeat(12,1fr);
    gap:4px;
  }
  .note-btn{
    background:#000;
    border:1px solid var(--fg-dim);
    color:var(--fg-dim);
    font-family:inherit;
    font-size:18px;
    padding:12px 2px;
    cursor:pointer;
    transition:all .08s;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .note-btn.sharp{border-style:dashed;color:var(--fg-faint);border-color:var(--fg-faint)}
  .note-btn:hover{border-color:var(--fg);color:var(--fg)}
  .note-btn.active{
    background:var(--fg);
    color:#000;
    border-color:var(--fg);
    box-shadow:0 0 12px var(--fg);
  }

  .controls{
    display:flex;gap:10px;justify-content:center;margin-top:6px;flex-wrap:wrap;
  }
  .ctl-btn{
    background:#000;
    border:1px solid var(--fg-dim);
    color:var(--fg-dim);
    font-family:inherit;
    font-size:18px;
    padding:8px 20px;
    cursor:pointer;
    letter-spacing:.1em;
  }
  .ctl-btn:hover{border-color:var(--fg);color:var(--fg)}
  .ctl-btn.danger:hover{border-color:var(--danger);color:var(--danger)}
  .ctl-btn.active{background:var(--fg);color:#000;border-color:var(--fg);box-shadow:0 0 10px var(--fg)}

  .key-panel{
    border:1px solid var(--fg-dim);
    padding:16px 18px;
    margin-bottom:20px;
  }
  .key-label{
    color:var(--fg-dim);
    font-size:16px;
    letter-spacing:.1em;
    text-transform:uppercase;
    margin-bottom:12px;
    text-align:center;
  }
  .key-scale-toggle{
    display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
    margin:12px 0 16px;
  }
  .key-chords{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(78px,1fr));
    gap:8px;
  }
  .chord-card{
    border:1px solid var(--fg-faint);
    padding:10px 6px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s;
    user-select:none;
  }
  .chord-card:hover{border-color:var(--fg-dim)}
  .chord-card.expanded{border-color:var(--fg);box-shadow:0 0 8px rgba(57,255,20,.2)}
  .chord-roman{display:block;color:var(--fg-dim);font-size:15px;letter-spacing:.05em}
  .chord-symbol{display:block;font-size:22px;text-shadow:0 0 5px var(--fg);margin-top:2px}
  .chord-card-notes{
    display:none;
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--fg-faint);
    font-size:14px;
    color:var(--fg-dim);
  }
  .chord-card.expanded .chord-card-notes{display:block}
  .chord-play-btn{
    margin-top:6px;
    font-size:13px;
    font-family:inherit;
    background:none;
    border:1px solid var(--fg-dim);
    color:var(--fg-dim);
    padding:3px 10px;
    cursor:pointer;
  }
  .chord-play-btn:hover{border-color:var(--fg);color:var(--fg)}

  .seq-panel{
    border:1px solid var(--fg-dim);
    padding:16px 18px;
    margin-bottom:20px;
  }
  .seq-transport{
    display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;
    margin-bottom:14px;
  }
  .seq-transport label, .seq-params label{
    color:var(--fg-dim);font-size:15px;letter-spacing:.08em;display:flex;align-items:center;gap:6px;
  }
  .seq-num-input{
    width:64px;
    background:#000;
    border:1px solid var(--fg-dim);
    color:var(--fg);
    font-family:inherit;
    font-size:18px;
    padding:4px 6px;
    text-align:center;
  }
  .seq-num-input:focus{outline:none;border-color:var(--fg)}

  .seq-timeline-wrap{
    position:relative;
    overflow-x:auto;
    overflow-y:hidden;
    padding:22px 10px 16px;
    margin-bottom:16px;
    border:1px dashed var(--fg-faint);
    -webkit-overflow-scrolling:touch;
  }
  .seq-ruler{
    position:relative;
    height:16px;
    margin-bottom:6px;
  }
  .seq-ruler-tick{
    position:absolute;
    bottom:0;
    width:1px;
    height:6px;
    background:var(--fg-faint);
  }
  .seq-ruler-tick.major{height:10px;background:var(--fg-dim)}
  .seq-ruler-num{
    position:absolute;
    top:0;
    font-size:11px;
    color:var(--fg-faint);
    transform:translateX(3px);
    white-space:nowrap;
  }
  /* fixed-length grid: background lines are hardcoded to SEQ_PX_PER_BEAT(48px)/bar(192px) — keep in sync with the JS constant */
  .seq-track{
    position:relative;
    height:52px;
    border:1px solid var(--fg-faint);
    background-image:
      repeating-linear-gradient(to right, rgba(57,255,20,.28) 0, rgba(57,255,20,.28) 1px, transparent 1px, transparent 192px),
      repeating-linear-gradient(to right, rgba(57,255,20,.1) 0, rgba(57,255,20,.1) 1px, transparent 1px, transparent 48px);
  }
  .seq-empty{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    color:var(--fg-faint);
    font-size:14px;
    letter-spacing:.08em;
    white-space:nowrap;
    pointer-events:none;
  }
  .seq-playhead{
    position:absolute;
    top:20px;bottom:16px;
    width:2px;
    background:var(--fg);
    box-shadow:0 0 8px var(--fg),0 0 2px var(--fg);
    pointer-events:none;
    display:none;
    /* absolute positioning is relative to the wrap's padding EDGE, which ignores
       the wrap's own padding — so left must start at that padding-left value
       (10px, from .seq-timeline-wrap above) to line up with beat 0 on the
       ruler/track, which are normal-flow children sitting inside that padding. */
    left:10px;
  }

  /* Drum grid sits inside the same scrolling .seq-timeline-wrap as the chord
     track (so it shares the ruler + horizontal scroll position exactly), while
     its row labels live in a separate, non-scrolling column to its left —
     avoids threading a label-width offset through every chord-clip coordinate. */
  .seq-timeline-outer{
    display:flex;
    align-items:flex-start;
  }
  .seq-drum-labels{
    flex:0 0 auto;
    width:64px;
    display:flex;
    flex-direction:column;
  }
  .seq-drum-label-item{
    height:24px;
    margin-top:3px;
    display:flex;
    align-items:center;
    padding:0 6px;
    font-size:11px;
    letter-spacing:.05em;
    color:var(--fg-dim);
    border:1px solid var(--fg-faint);
    white-space:nowrap;
    overflow:hidden;
  }
  .seq-drum-label-item:first-child{margin-top:0}
  .seq-drum-grid{
    margin-top:10px;
    display:flex;
    flex-direction:column;
  }
  .seq-drum-row{
    display:flex;
    height:24px;
    margin-top:3px;
  }
  .seq-drum-row:first-child{margin-top:0}
  .seq-drum-step{
    flex:0 0 auto;
    height:100%;
    border:1px solid var(--fg-faint);
    border-left:none;
    background:#050505;
    cursor:pointer;
  }
  .seq-drum-step:first-child{border-left:1px solid var(--fg-faint)}
  .seq-drum-step.beat-start{border-left-color:var(--fg-dim)}
  .seq-drum-step:hover{border-color:var(--fg-dim)}
  .seq-drum-step.active{background:var(--fg);box-shadow:0 0 6px var(--fg) inset}
  .seq-clip{
    position:absolute;
    top:4px;
    height:44px;
    display:flex;
    flex-direction:column;
    border:1px solid var(--fg-dim);
    background:rgba(57,255,20,.07);
    touch-action:none;
    cursor:grab;
    user-select:none;
    -webkit-user-select:none;
  }
  .seq-clip.active{border-color:var(--fg);box-shadow:0 0 10px rgba(57,255,20,.4);background:rgba(57,255,20,.18)}
  .seq-clip.seq-clip-dragging{cursor:grabbing;opacity:.9;box-shadow:0 6px 18px rgba(0,0,0,.6);z-index:200}
  .seq-clip-label{
    flex:0 0 auto;
    font-size:14px;
    text-align:center;
    padding:3px 11px 1px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-shadow:0 0 4px var(--fg);
  }
  .seq-clip-hits{flex:1 1 auto;display:flex}
  .seq-clip-hit{flex:1 1 0;border-right:1px solid rgba(57,255,20,.2)}
  .seq-clip-hit:last-child{border-right:none}
  .seq-clip-remove{
    position:absolute;top:-1px;right:-1px;
    background:#000;border:none;color:var(--fg-faint);
    font-size:13px;cursor:pointer;line-height:1;padding:2px 4px;
    font-family:inherit;
  }
  .seq-clip-remove:hover{color:var(--danger)}
  .seq-clip-handle{
    position:absolute;top:0;bottom:0;width:10px;
    cursor:ew-resize;touch-action:none;
  }
  .seq-clip-handle.left{left:-1px}
  .seq-clip-handle.right{right:-1px}
  .seq-clip-handle:hover,.seq-clip-handle.seq-handle-active{background:rgba(57,255,20,.35)}

  .seq-quality-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(64px,1fr));
    gap:4px;
    margin:10px 0;
  }
  .seq-quality-btn{padding:6px 4px;font-size:14px}

  .seq-params{
    display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;
    margin-top:10px;
  }

  .footer-hint{
    margin-top:auto;
    padding-top:24px;
    text-align:center;
    color:var(--fg-faint);
    font-size:16px;
    letter-spacing:.1em;
  }

  @media (max-width:560px){
    body{font-size:19px}
    .note-grid{grid-template-columns:repeat(6,1fr)}
    #chord-display{font-size:clamp(44px,16vw,72px)}
  }
</style>
</head>
<body>

<div id="crt"></div>
<a href="index.html" class="home-btn">[ESC] BACK TO TRUEMORE</a>

<div class="wrap">
  <div class="title-bar">C:\WTS&gt; RUN CHORD.EXE — WHAT THE SOUND v1.0</div>

  <div class="screen">
    <div class="mic-inline">
      <span class="mic-title">MIC.SYS — <span id="mic-status">STANDBY</span></span>
      <button class="ctl-btn" id="mic-btn">[ENABLE MIC]</button>
    </div>
    <div id="chord-display" class="blink">READY</div>
    <div id="chord-detail">選擇下方音符以偵測和弦 / CLICK NOTES BELOW TO DETECT CHORD</div>
    <div id="mic-readout" class="mic-readout"></div>
    <div id="mic-bar" class="mic-bar"></div>
  </div>

  <div class="octave-block" id="octave-3"></div>
  <div class="octave-block" id="octave-4"></div>

  <div class="controls">
    <button class="ctl-btn danger" id="clear-btn">[CLEAR BUFFER]</button>
  </div>

  <div class="footer-hint">TAP NOTES, OR SING/PLAY INTO MIC (HOLD ~0.3s) · CHORD AUTO-DETECTED FROM LOWEST NOTE</div>

  <div class="key-panel">
    <div class="key-label">KEY.SYS — SCALE EXPLORER</div>
    <div class="note-grid" id="key-root-grid"></div>
    <div class="key-scale-toggle" id="key-scale-toggle">
      <button class="ctl-btn key-scale-btn" data-scale="Major">MAJOR</button>
      <button class="ctl-btn key-scale-btn" data-scale="Natural Minor">MINOR</button>
      <button class="ctl-btn key-scale-btn" data-scale="Harmonic Minor">HARM. MINOR</button>
    </div>
    <div class="key-chords" id="key-chords"></div>
  </div>

  <div class="seq-panel">
    <div class="key-label">SEQ.SYS — CHORD LOOPER</div>

    <div class="seq-transport">
      <label>BPM <input type="number" id="seq-bpm" class="seq-num-input" value="90" min="20" max="300"></label>
      <label>LENGTH (BARS) <input type="number" id="seq-bars" class="seq-num-input" value="8" min="1" max="64"></label>
      <button class="ctl-btn" id="seq-play-btn">[▶ PLAY]</button>
    </div>

    <div class="seq-timeline-outer">
      <div class="seq-drum-labels" id="seq-drum-labels"></div>
      <div class="seq-timeline-wrap" id="seq-timeline-wrap">
        <div class="seq-ruler" id="seq-ruler"></div>
        <div class="seq-track" id="seq-track"></div>
        <div class="seq-drum-grid" id="seq-drum-grid"></div>
        <div class="seq-playhead" id="seq-playhead"></div>
      </div>
    </div>

    <div class="seq-builder">
      <div class="note-grid" id="seq-root-grid"></div>
      <div class="seq-quality-grid" id="seq-quality-grid"></div>
      <div class="seq-params">
        <label>BEATS <input type="number" id="seq-beats" class="seq-num-input" value="4" min="1" max="32"></label>
        <label>HITS <input type="number" id="seq-hits" class="seq-num-input" value="1" min="1" max="8"></label>
        <button class="ctl-btn" id="seq-add-btn">[+ ADD TO TRACK]</button>
      </div>
    </div>
  </div>

  <div class="dice-panel" id="dice-panel">
    <div class="dice-label">DICE.SYS — <span id="dice-hint">CLICK TO ROLL</span></div>
    <pre class="dice-face" id="dice-face"></pre>
  </div>

  <div id="boot-log"></div>
</div>

<script>
(function(){
  const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const BASE_MIDI = 48; // C3
  const TOTAL_NOTES = 24; // two octaves

  // interval set (sorted, comma-joined, relative to candidate root) -> chord quality suffix
  const CHORD_DICT = {
    "0,7":"5",
    "0,4":"(no5)",
    "0,3":"m(no5)",
    "0,4,7":"",
    "0,3,7":"m",
    "0,3,6":"dim",
    "0,4,8":"aug",
    "0,5,7":"sus4",
    "0,2,7":"sus2",
    "0,4,7,11":"maj7",
    "0,4,7,10":"7",
    "0,3,7,10":"m7",
    "0,3,6,9":"dim7",
    "0,3,6,10":"m7b5",
    "0,4,7,9":"6",
    "0,3,7,9":"m6",
    "0,2,4,7,11":"maj9",
    "0,2,4,7,10":"9",
    "0,2,3,7,10":"m9",
    "0,2,5,7,10":"9sus4"
  };

  const selected = new Set();
  const chordDisplay = document.getElementById('chord-display');
  const chordDetail = document.getElementById('chord-detail');
  const bootLog = document.getElementById('boot-log');

  function midiToFreq(midi){ return 440 * Math.pow(2, (midi - 69) / 12); }
  function freqToMidi(freq){ return 69 + 12 * Math.log2(freq / 440); }
  function noteName(idx){ return NOTE_NAMES[idx % 12]; }
  function noteFullName(idx){ return NOTE_NAMES[idx % 12] + (3 + Math.floor(idx / 12)); }

  // ---- Audio ----
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      log('AUDIO ENGINE... ONLINE', true);
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTone(freq, duration, peakGain){
    ensureAudio();
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peakGain, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }
  function beep(idx){
    const midi = BASE_MIDI + idx;
    const freq = midiToFreq(midi);
    playTone(freq, 0.4, 0.15);
    return freq;
  }

  // ---- Log ----
  function log(msg, hl){

  // ---- Chord analysis ----
  function analyzeChord(indices){
    if(indices.length === 0) return null;
    const sorted = [...indices].sort((a,b)=>a-b);
    if(sorted.length === 1){
      return { text: noteFullName(sorted[0]), detail: 'SINGLE NOTE' };
    }
    const bassPc = sorted[0] % 12;
    const pcSet = [...new Set(sorted.map(n => n % 12))];
    const candidates = [bassPc, ...pcSet.filter(pc => pc !== bassPc)];
    for(const root of candidates){
      const intervals = [...new Set(pcSet.map(pc => (pc - root + 12) % 12))].sort((a,b)=>a-b);
      const key = intervals.join(',');
      if(Object.prototype.hasOwnProperty.call(CHORD_DICT, key)){
        const quality = CHORD_DICT[key];
        const rootName = NOTE_NAMES[root];
        if(root === bassPc){
          return { text: rootName + quality, detail: 'ROOT POSITION · NOTES: ' + sorted.map(noteFullName).join(' ') };
        }
        const bassName = NOTE_NAMES[bassPc];
        return { text: rootName + quality + '/' + bassName, detail: 'INVERSION · NOTES: ' + sorted.map(noteFullName).join(' ') };
      }
    }
    return { text: NOTE_NAMES[bassPc] + '(?)', detail: 'UNRECOGNIZED — ' + pcSet.length + ' TONES · NOTES: ' + sorted.map(noteFullName).join(' ') };
  }

  // ---- Mic pitch detection ----
  // Autocorrelation (ACF) over the mic's time-domain buffer: finds the lag that
  // best repeats the waveform, refines it with parabolic interpolation, and
  // returns a clarity score (0-1) so a noisy/silent signal can be rejected.
  function autoCorrelate(buf, sampleRate){
    const SIZE = buf.length;
    let acf0 = 0;
    for(let i = 0; i < SIZE; i++) acf0 += buf[i] * buf[i];
    acf0 /= SIZE;
    if(Math.sqrt(acf0) < 0.01) return null; // effectively silent

    const maxLag = Math.min(SIZE - 1, Math.floor(sampleRate / 80));   // ~80Hz floor
    const minLag = Math.max(2, Math.floor(sampleRate / 1200));        // ~1200Hz ceiling

    const corr = new Float32Array(maxLag - minLag + 1);
    let globalMax = -Infinity;
    for(let lag = minLag; lag <= maxLag; lag++){
      let sum = 0;
      for(let i = 0; i < SIZE - lag; i++) sum += buf[i] * buf[i + lag];
      sum /= (SIZE - lag);
      corr[lag - minLag] = sum;
      if(sum > globalMax) globalMax = sum;
    }

    // A harmonic tone's ACF peaks at every multiple of the true period, so the
    // raw global max often lands on a subharmonic (octave error). Taking the
    // *earliest* strong peak instead reliably lands on the true fundamental.
    let bestIdx = -1;
    for(let i = 1; i < corr.length - 1; i++){
      if(corr[i] >= globalMax * 0.85 && corr[i] >= corr[i - 1] && corr[i] >= corr[i + 1]){
        bestIdx = i;
        break;
      }
    }
    if(bestIdx === -1) bestIdx = corr.indexOf(globalMax);
    if(bestIdx <= 0 || bestIdx >= corr.length - 1){
      const bestLag = minLag + Math.max(bestIdx, 0);
      return { freq: sampleRate / bestLag, clarity: globalMax / acf0 };
    }

    const cPrev = corr[bestIdx - 1], cHere = corr[bestIdx], cNext = corr[bestIdx + 1];
    const denom = (cPrev - 2 * cHere + cNext);
    const shift = denom !== 0 ? 0.5 * (cPrev - cNext) / denom : 0;
    const refinedLag = (minLag + bestIdx) + shift;

    return { freq: sampleRate / refinedLag, clarity: cHere / acf0 };
  }

  function centsBar(cents){
    const width = 21;
    const center = Math.floor(width / 2);
    const clamped = Math.max(-50, Math.min(50, cents));
    const pos = Math.round((clamped + 50) / 100 * (width - 1));
    let bar = '';
    for(let i = 0; i < width; i++){
      bar += (i === pos) ? '●' : (i === center ? '│' : '─');
    }
    return '♭' + bar + '♯';
  }

  const micBar = document.getElementById('mic-bar');

  let micStream = null, micSourceNode = null, micAnalyser = null, micIntervalId = null, micActive = false;
  let micLastMidi = null, micStableSince = 0, micLatchedMidi = null;

  const CLARITY_THRESHOLD = 0.9; // empirically-tunable: raise to reject more noise, lower if real notes get ignored

  function micAnalyzeTick(){
    const buf = new Float32Array(micAnalyser.fftSize);
    micAnalyser.getFloatTimeDomainData(buf);
    const result = autoCorrelate(buf, audioCtx.sampleRate);

    if(!result || result.clarity < CLARITY_THRESHOLD || result.freq < 70 || result.freq > 1500){
      micReadout.textContent = 'LISTENING...';
      micBar.textContent = '';
      micLastMidi = null;
      micLatchedMidi = null;
      return;
    }

    const midiFloat = freqToMidi(result.freq);
    const midiRounded = Math.round(midiFloat);
    const cents = Math.round((midiFloat - midiRounded) * 100);
    const noteText = NOTE_NAMES[((midiRounded % 12) + 12) % 12] + (Math.floor(midiRounded / 12) - 1);

    micReadout.textContent = noteText + '   ' + (cents >= 0 ? '+' : '') + cents + '¢   ' + result.freq.toFixed(1) + 'Hz';
    micBar.textContent = centsBar(cents);

    if(midiRounded === micLastMidi){
      if(micLatchedMidi !== midiRounded && Date.now() - micStableSince > 350){
        const idx = midiRounded - BASE_MIDI;
        if(idx >= 0 && idx < TOTAL_NOTES && !selected.has(idx)){
          selected.add(idx);
          const btn = document.querySelector('.note-btn[data-index="' + idx + '"]');
          if(btn) btn.classList.add('active');
          updateDisplay();
          log('MIC ADDED: ' + noteFullName(idx), true);
        }
        micLatchedMidi = midiRounded;
      }
    } else {
      micLastMidi = midiRounded;
      micStableSince = Date.now();
      micLatchedMidi = null;
    }
  }

  async function enableMic(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      micStatus.textContent = 'ERR: NOT SUPPORTED';
      log('MIC ERROR: getUserMedia NOT SUPPORTED (NEEDS HTTPS)', true);
      return;
    }
    try{
      ensureAudio();
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false }
      });
      micSourceNode = audioCtx.createMediaStreamSource(micStream);
      micAnalyser = audioCtx.createAnalyser();
      micAnalyser.fftSize = 2048;
      micSourceNode.connect(micAnalyser); // NOT connected to destination — avoids feeding mic back to speakers
      micActive = true;
      micBtn.textContent = '[DISABLE MIC]';
      micStatus.textContent = 'ONLINE';
      micReadout.textContent = 'LISTENING...';
      log('MIC ENGINE... ONLINE', true);
      micIntervalId = setInterval(micAnalyzeTick, 50);
    } catch(err){
      micStatus.textContent = 'ERR: ' + err.name;
      micReadout.textContent = 'MIC UNAVAILABLE';
      log('MIC ERROR: ' + err.name, true);
    }
  }

  function disableMic(){
    if(micIntervalId) clearInterval(micIntervalId);
    micIntervalId = null;
    if(micSourceNode) micSourceNode.disconnect();
    if(micStream) micStream.getTracks().forEach(t => t.stop());
    micStream = null; micSourceNode = null; micAnalyser = null;
    micActive = false;
    micBtn.textContent = '[ENABLE MIC]';
    micStatus.textContent = 'STANDBY';
    micReadout.textContent = '';
    micBar.textContent = '';
    log('MIC ENGINE... OFFLINE', true);
  }

  // ---- Key / scale explorer ----
  const SCALES = {
    'Major': [0,2,4,5,7,9,11],
    'Natural Minor': [0,2,3,5,7,8,10],
    'Harmonic Minor': [0,2,3,5,7,8,11]
  };
  const ROMAN_BASE = ['I','II','III','IV','V','VI','VII'];

  let keyRootPc = 0;          // C
  let keyScaleName = 'Major';

  function romanFor(degree, quality){
    const isMinorFamily = (quality === 'm' || quality === 'dim');
    let numeral = isMinorFamily ? ROMAN_BASE[degree].toLowerCase() : ROMAN_BASE[degree];
    if(quality === 'dim') numeral += '°';
    if(quality === 'aug') numeral += '+';
    return numeral;
  }

  function diatonicChords(rootPc, scaleName){
    const scale = SCALES[scaleName];
    const chords = [];
    for(let degree = 0; degree < 7; degree++){
      const pcs = [degree, (degree + 2) % 7, (degree + 4) % 7].map(i => (rootPc + scale[i]) % 12);
      const chordRootPc = pcs[0];
      const intervals = [...new Set(pcs.map(pc => (pc - chordRootPc + 12) % 12))].sort((a, b) => a - b);
      const key = intervals.join(',');
      const quality = Object.prototype.hasOwnProperty.call(CHORD_DICT, key) ? CHORD_DICT[key] : '?';
      chords.push({ degree, roman: romanFor(degree, quality), symbol: NOTE_NAMES[chordRootPc] + quality, pcs });
    }
    return chords;
  }

  function voiceChordMidis(pcs, baseMidi){
    const midis = [];
    let prev = baseMidi - 1;
    pcs.forEach(pc => {
      let midi = prev + 1;
      while(((midi % 12) + 12) % 12 !== pc) midi++;
      midis.push(midi);
      prev = midi;
    });
    return midis;
  }

  function playChord(pcs){
    voiceChordMidis(pcs, BASE_MIDI).forEach(midi => playTone(midiToFreq(midi), 0.6, 0.09));

  // ---- Drum kit: basic synthesized voices (no samples), sharing the same
  // fixed timeline + BPM + play/stop as the chord looper above. Steps are
  // plain tap-toggles (no drag), so none of the pointer-drag machinery the
  // chord clips need applies here.
  let seqNoiseBuffer = null;
  function seqGetNoiseBuffer(){
    if(!seqNoiseBuffer){
      const len = audioCtx.sampleRate; // 1s of white noise, sliced per-hit
      seqNoiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = seqNoiseBuffer.getChannelData(0);
      for(let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    }
    return seqNoiseBuffer;
  }

  function seqPlayOscHit(time, { type, freq, freqEnd, freqRampTime, gain, decay }){
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, time);
    if(freqEnd !== undefined) osc.frequency.exponentialRampToValueAtTime(freqEnd, time + freqRampTime);
    g.gain.setValueAtTime(gain, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + decay);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + decay + 0.02);
    seqActiveNodes.push(osc);
    osc.onended = () => { seqActiveNodes = seqActiveNodes.filter(n => n !== osc); };
  }

  function seqPlayNoiseHit(time, { filterType, freq, q, gain, decay }){
    const src = audioCtx.createBufferSource();
    src.buffer = seqGetNoiseBuffer();
    const filter = audioCtx.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.value = freq;
    if(q !== undefined) filter.Q.value = q;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(gain, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + decay);
    src.connect(filter).connect(g).connect(audioCtx.destination);
    src.start(time);
    src.stop(time + decay + 0.02);
    seqActiveNodes.push(src);
    src.onended = () => { seqActiveNodes = seqActiveNodes.filter(n => n !== src); };
  }

  function seqTriggerKick(time){
    seqPlayOscHit(time, { type: 'sine', freq: 150, freqEnd: 45, freqRampTime: 0.12, gain: 0.9, decay: 0.28 });
  }
  function seqTriggerSnare(time){
    seqPlayNoiseHit(time, { filterType: 'highpass', freq: 1000, gain: 0.5, decay: 0.15 });
    seqPlayOscHit(time, { type: 'triangle', freq: 180, gain: 0.5, decay: 0.1 });
  }
  function seqTriggerClap(time){
    [0, 0.012, 0.024].forEach(off =>
      seqPlayNoiseHit(time + off, { filterType: 'bandpass', freq: 1200, q: 1.2, gain: 0.45, decay: 0.08 })
    );
  }
  function seqTriggerClosedHat(time){
    seqPlayNoiseHit(time, { filterType: 'highpass', freq: 7000, gain: 0.35, decay: 0.04 });
  }
  function seqTriggerOpenHat(time){
    seqPlayNoiseHit(time, { filterType: 'highpass', freq: 7000, gain: 0.3, decay: 0.24 });
  }

          else { seqDrumPattern[voice.id].add(s); cell.classList.add('active'); }

  // One-time measurement: aligns the frozen label column's first row with the
  // drum grid's first row inside the scrolling wrap. Ruler/track height is
  // fixed CSS, but measuring beats hardcoding a number that silently drifts
  // if that CSS ever changes.
  function syncDrumLabels(){
    const firstItem = seqDrumLabelsEl.querySelector('.seq-drum-label-item');
    if(!firstItem) return;
    const offset = seqDrumGridEl.getBoundingClientRect().top - seqTimelineWrapEl.getBoundingClientRect().top;
    firstItem.style.marginTop = offset + 'px';
  }
  syncDrumLabels();

  seqBarsInput.addEventListener('change', () => {
    const total = seqTotalBeats();
    seqClips.forEach(c => {
      if(c.length > total) c.length = total;
      if(c.start + c.length > total) c.start = Math.max(0, total - c.length);
    });
    const totalSteps = total * SEQ_STEPS_PER_BEAT;
    DRUM_VOICES.forEach(v => {
      [...seqDrumPattern[v.id]].forEach(s => { if(s >= totalSteps) seqDrumPattern[v.id].delete(s); });
    });
    renderTrack();
    renderDrumGrid();
    log('TIMELINE LENGTH: ' + Math.round(total / SEQ_BEATS_PER_BAR) + ' BARS', true);
  });

  // ---- Clip move + resize: Pointer Events unify mouse + touch, so one code
  // path drives both. Clips are absolutely positioned by (start, length) in
  // beats — dragging just writes new beat values and re-derives pixels, no
  // DOM reordering needed. Neighbor bounds are captured once at drag-start so
  // clips can't be dragged/resized into each other.
  let seqDrag = null;

  function findLeftNeighborEnd(clip){
    let bound = 0;
    seqClips.forEach(c => {
      if(c === clip) return;
      const end = c.start + c.length;
      if(end <= clip.start && end > bound) bound = end;
    });
    return bound;
  }
  function findRightNeighborStart(clip){
    let bound = seqTotalBeats();
    seqClips.forEach(c => {
      if(c === clip) return;
      if(c.start >= clip.start + clip.length && c.start < bound) bound = c.start;
    });
    return bound;
  }

  function updateClipMove(clientX){
    const laneRect = seqTrackEl.getBoundingClientRect();
    let newStart = Math.round((clientX - laneRect.left) / SEQ_PX_PER_BEAT - seqDrag.grabOffsetBeats);
    newStart = Math.max(seqDrag.leftBound, Math.min(seqDrag.rightBound - seqDrag.clip.length, newStart));
    seqDrag.clip.start = newStart;
    seqDrag.el.style.left = (newStart * SEQ_PX_PER_BEAT) + 'px';
  }

  function updateClipResize(clientX){
    const dxBeats = (clientX - seqDrag.startClientX) / SEQ_PX_PER_BEAT;
    if(seqDrag.mode === 'resize-right'){
      let newLength = Math.round(seqDrag.origLength + dxBeats);
      newLength = Math.max(SEQ_MIN_CLIP_BEATS, Math.min(seqDrag.rightBound - seqDrag.clip.start, newLength));
      seqDrag.clip.length = newLength;
    } else {
      let newStart = Math.round(seqDrag.origStart + dxBeats);
      const maxStart = seqDrag.origStart + seqDrag.origLength - SEQ_MIN_CLIP_BEATS;
      newStart = Math.max(seqDrag.leftBound, Math.min(maxStart, newStart));
      seqDrag.clip.length = seqDrag.origLength - (newStart - seqDrag.origStart);
      seqDrag.clip.start = newStart;
    }
    seqDrag.el.style.left = (seqDrag.clip.start * SEQ_PX_PER_BEAT) + 'px';
    seqDrag.el.style.width = (seqDrag.clip.length * SEQ_PX_PER_BEAT) + 'px';
  }

  let seqAutoScrollDir = 0, seqAutoScrollRAF = null;
  function seqEdgeAutoScroll(clientX){
    const wrapRect = seqTimelineWrapEl.getBoundingClientRect();
    const margin = 44;
    if(clientX < wrapRect.left + margin) seqAutoScrollDir = -1;
    else if(clientX > wrapRect.right - margin) seqAutoScrollDir = 1;
    else seqAutoScrollDir = 0;
    if(seqAutoScrollDir !== 0 && !seqAutoScrollRAF) seqAutoScrollStep();
  }
  function seqAutoScrollStep(){
    if(!seqDrag || seqAutoScrollDir === 0){ seqAutoScrollRAF = null; return; }
    seqTimelineWrapEl.scrollLeft += seqAutoScrollDir * 12;
    if(seqDrag.mode === 'move') updateClipMove(seqDrag.lastClientX);
    else updateClipResize(seqDrag.lastClientX);
    seqAutoScrollRAF = requestAnimationFrame(seqAutoScrollStep);
  }
  function seqStopAutoScroll(){
    seqAutoScrollDir = 0;
    if(seqAutoScrollRAF) cancelAnimationFrame(seqAutoScrollRAF);
    seqAutoScrollRAF = null;
  }

  function attachClipDrag(el, clip){
    el.addEventListener('pointerdown', (e) => {
      if(e.target.closest('.seq-clip-remove') || e.target.closest('.seq-clip-handle')) return;
      if(e.pointerType === 'mouse' && e.button !== 0) return;

      const laneRect = seqTrackEl.getBoundingClientRect();
      seqDrag = {
        mode: 'move', clip, el,
        grabOffsetBeats: (e.clientX - laneRect.left) / SEQ_PX_PER_BEAT - clip.start,
        leftBound: findLeftNeighborEnd(clip),
        rightBound: findRightNeighborStart(clip),
        lastClientX: e.clientX
      };
      el.classList.add('seq-clip-dragging');
      el.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    el.addEventListener('pointermove', (e) => {
      if(!seqDrag || seqDrag.el !== el || seqDrag.mode !== 'move') return;
      seqDrag.lastClientX = e.clientX;
      updateClipMove(e.clientX);
      seqEdgeAutoScroll(e.clientX);
    });

    function endDrag(){
      if(!seqDrag || seqDrag.el !== el || seqDrag.mode !== 'move') return;
      seqStopAutoScroll();
      el.classList.remove('seq-clip-dragging');
      log('CLIP MOVED: ' + NOTE_NAMES[clip.root] + clip.quality + ' → BEAT ' + clip.start, true);
      seqDrag = null;
    }
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
  }

  function attachClipResize(handleEl, clip, el, side){
    handleEl.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      seqDrag = {
        mode: 'resize-' + side, clip, el,
        origStart: clip.start,
        origLength: clip.length,
        leftBound: findLeftNeighborEnd(clip),
        rightBound: findRightNeighborStart(clip),
        startClientX: e.clientX,
        lastClientX: e.clientX
      };
      handleEl.classList.add('seq-handle-active');
      handleEl.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    handleEl.addEventListener('pointermove', (e) => {
      if(!seqDrag || seqDrag.el !== el || seqDrag.mode !== 'resize-' + side) return;
      seqDrag.lastClientX = e.clientX;
      updateClipResize(e.clientX);
      seqEdgeAutoScroll(e.clientX);
    });

    function endResize(){
      if(!seqDrag || seqDrag.el !== el || seqDrag.mode !== 'resize-' + side) return;
      seqStopAutoScroll();
      handleEl.classList.remove('seq-handle-active');
      log('CLIP RESIZED: ' + NOTE_NAMES[clip.root] + clip.quality + ' → ' + clip.length + ' BEATS', true);
      seqDrag = null;
      renderTrack();
    }
    handleEl.addEventListener('pointerup', endResize);
    handleEl.addEventListener('pointercancel', endResize);
  }

  function renderTrack(){
    seqTrackEl.innerHTML = '';
    seqTrackEl.style.width = (seqTotalBeats() * SEQ_PX_PER_BEAT) + 'px';

    if(seqClips.length === 0){
      const empty = document.createElement('div');
      empty.className = 'seq-empty';
      empty.textContent = 'TRACK EMPTY — ADD A CHORD BELOW';
      seqTrackEl.appendChild(empty);
    }

    seqClips.forEach(clip => {
      const el = document.createElement('div');
      el.className = 'seq-clip';
      el.dataset.id = clip.id;
      el.style.left = (clip.start * SEQ_PX_PER_BEAT) + 'px';
      el.style.width = (clip.length * SEQ_PX_PER_BEAT) + 'px';
      el.title = clip.length + ' BEATS × ' + clip.hits + (clip.hits > 1 ? ' HITS' : ' HIT');

      const removeBtn = document.createElement('button');
      removeBtn.className = 'seq-clip-remove';
      removeBtn.textContent = '×';
      removeBtn.addEventListener('click', () => {
        const idx = seqClips.indexOf(clip);
        if(idx >= 0) seqClips.splice(idx, 1);
        renderTrack();
      });

      const labelEl = document.createElement('div');
      labelEl.className = 'seq-clip-label';
      labelEl.textContent = NOTE_NAMES[clip.root] + clip.quality;

      const hitsEl = document.createElement('div');
      hitsEl.className = 'seq-clip-hits';
      for(let h = 0; h < clip.hits; h++){
        const hit = document.createElement('div');
        hit.className = 'seq-clip-hit';
        hitsEl.appendChild(hit);
      }

      const leftHandle = document.createElement('div');
      leftHandle.className = 'seq-clip-handle left';
      const rightHandle = document.createElement('div');
      rightHandle.className = 'seq-clip-handle right';

      el.appendChild(removeBtn);
      el.appendChild(labelEl);
      el.appendChild(hitsEl);
      el.appendChild(leftHandle);
      el.appendChild(rightHandle);
      seqTrackEl.appendChild(el);

      attachClipDrag(el, clip);
      attachClipResize(leftHandle, clip, el, 'left');
      attachClipResize(rightHandle, clip, el, 'right');
    });

    renderRuler();
    seqPlayheadEl.style.display = seqPlaying ? 'block' : 'none';
  }
  renderTrack();

  document.getElementById('seq-add-btn').addEventListener('click', () => {
    const beats = Math.max(SEQ_MIN_CLIP_BEATS, Math.min(32, parseInt(seqBeatsInput.value, 10) || 4));
    const hits = Math.max(1, Math.min(8, parseInt(seqHitsInput.value, 10) || 1));
    const totalBeats = seqTotalBeats();
    const start = seqClips.reduce((m, c) => Math.max(m, c.start + c.length), 0);
    if(start >= totalBeats){
      log('TIMELINE FULL — EXTEND LENGTH (BARS) OR DRAG CLIPS TO MAKE ROOM', true);
      return;
    }
    const length = Math.min(beats, totalBeats - start);
    seqClips.push({ id: seqNextClipId++, root: seqBuilderRoot, quality: seqBuilderQuality, start, length, hits });
    renderTrack();
    log('TRACK: ADDED ' + NOTE_NAMES[seqBuilderRoot] + seqBuilderQuality + ' @ BEAT ' + start + ' (' + length + 'b x' + hits + ')', true);
  });

  // Real ADSR: attack up, decay down to a sustain plateau, HOLD the sustain
  // for the note's FULL nominal duration (like a MIDI note staying on until
  // note-off), and only start the release *after* that point — so the tail
  // rings out past the note's length instead of eating into it. a/d shrink
  // for very short/fast hits so they never overrun the note's own duration;
  // r is a fixed tail that only gets shortened for extremely fast hits so
  // rapid runs don't wash into an indistinct blur.
  const SEQ_ADSR = { attack: 0.015, decay: 0.09, sustainLevel: 0.72, release: 0.09 };

  function scheduleADSR(gainParam, startTime, duration, peak){
    const a = Math.max(0.001, Math.min(SEQ_ADSR.attack, duration * 0.4));
    const d = Math.max(0.001, Math.min(SEQ_ADSR.decay, Math.max(duration - a, 0.001) * 0.6));
    const r = Math.min(SEQ_ADSR.release, Math.max(duration * 0.5, 0.03));
    const attackEnd = startTime + a;
    const decayEnd = attackEnd + d;
    const noteOff = startTime + duration;          // sustain holds all the way to here, no early fade
    const releaseStart = Math.max(decayEnd, noteOff);
    const noteEnd = releaseStart + r;
    const sustain = peak * SEQ_ADSR.sustainLevel;

    gainParam.setValueAtTime(0.0001, startTime);
    gainParam.exponentialRampToValueAtTime(peak, attackEnd);
    gainParam.exponentialRampToValueAtTime(sustain, decayEnd);
    gainParam.setValueAtTime(sustain, releaseStart);
    gainParam.exponentialRampToValueAtTime(0.0001, noteEnd);
    return noteEnd;
  }

  function seqScheduleTone(freq, startTime, duration, peakGain){
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, startTime);
    const noteEnd = scheduleADSR(gain.gain, startTime, duration, peakGain);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(noteEnd + 0.02);
    seqActiveNodes.push(osc);
    osc.onended = () => { seqActiveNodes = seqActiveNodes.filter(n => n !== osc); };
  }

  function highlightSeqClip(clipId, on){
    const el = seqTrackEl.querySelector('.seq-clip[data-id="' + clipId + '"]');
    if(el) el.classList.toggle('active', on);
  }

  const SEQ_LOOKAHEAD = 0.05;       // pre-roll before the very first note of playback
  const SEQ_SCHEDULE_AHEAD = 0.15; // how far ahead of the next loop's start we re-arm the JS timer

  // audioCtx-clock time the next full loop must start at. Advanced by exact
  // addition (+totalSec) every cycle instead of being re-derived from
  // audioCtx.currentTime when the setTimeout callback happens to fire — that
  // re-derivation is what caused the audible gap/drift at the loop seam,
  // since setTimeout always fires "at least" that long after, never exactly.
  let seqNextCycleTime = 0;

  // Schedules one full loop of the fixed-length timeline using the Web Audio clock
  // (not setTimeout) for the actual sound, so playback stays sample-accurate
  // regardless of JS timer jitter. Re-arms itself well before the loop ends so
  // there's always slack to absorb timer jitter without missing the seam.
  function seqCycle(){
    if(!seqPlaying) return;
    ensureAudio();
    const bpm = Math.max(20, Math.min(300, parseInt(seqBpmInput.value, 10) || 90));
    const beatSec = 60 / bpm;
    const totalBeats = seqTotalBeats();
    const totalSec = totalBeats * beatSec;

    const baseTime = seqNextCycleTime;
    const untilBase = Math.max(0, baseTime - audioCtx.currentTime);

    seqClips.forEach(clip => {
      const clipStartSec = clip.start * beatSec;
      const clipDurSec = clip.length * beatSec;
      const hitDurSec = clipDurSec / clip.hits;
      const intervals = QUALITY_INTERVALS[clip.quality] || [0, 4, 7];
      const pcs = intervals.map(iv => (clip.root + iv) % 12);
      const midis = voiceChordMidis(pcs, BASE_MIDI);

      for(let h = 0; h < clip.hits; h++){
        const hitStartSec = clipStartSec + h * hitDurSec;
        midis.forEach(midi => seqScheduleTone(midiToFreq(midi), baseTime + hitStartSec, hitDurSec, 0.055));
      }

      const onId = setTimeout(() => highlightSeqClip(clip.id, true), (untilBase + clipStartSec) * 1000);
      const offId = setTimeout(() => highlightSeqClip(clip.id, false), (untilBase + clipStartSec + clipDurSec) * 1000);
      seqTimeoutIds.push(onId, offId);
    });

    const stepSec = beatSec / SEQ_STEPS_PER_BEAT;
    DRUM_VOICES.forEach(voice => {
      seqDrumPattern[voice.id].forEach(stepIndex => {
        voice.trigger(baseTime + stepIndex * stepSec);
      });
    });

    startSeqPlayhead(baseTime, totalSec, totalBeats);

    seqNextCycleTime = baseTime + totalSec;
    const delay = Math.max(0, seqNextCycleTime - audioCtx.currentTime - SEQ_SCHEDULE_AHEAD);
    const loopId = setTimeout(seqCycle, delay * 1000);
    seqTimeoutIds.push(loopId);
  }

  // Playhead position is derived from the Web Audio clock each frame (not
  // accumulated), so it can't drift out of sync with the scheduled tones.
  function startSeqPlayhead(cycleStartTime, totalSec, totalBeats){
    if(seqPlayheadRAF) cancelAnimationFrame(seqPlayheadRAF);
    seqPlayheadEl.style.display = 'block';
    const totalPx = totalBeats * SEQ_PX_PER_BEAT;
    function tick(){
      if(!seqPlaying){ seqPlayheadEl.style.display = 'none'; seqPlayheadRAF = null; return; }
      const elapsed = audioCtx.currentTime - cycleStartTime;
      const frac = Math.max(0, Math.min(1, totalSec > 0 ? elapsed / totalSec : 0));
      seqPlayheadEl.style.transform = 'translateX(' + (frac * totalPx) + 'px)';
      seqPlayheadRAF = requestAnimationFrame(tick);
    }
    tick();
  }

  function startSequence(){
    if(!seqHasAnyContent()){ log('TRACK EMPTY — ADD A CHORD OR DRUM HIT FIRST', true); return; }
    ensureAudio();
    seqPlaying = true;
    seqPlayBtn.textContent = '[■ STOP]';
    log('SEQ PLAYING @ ' + seqBpmInput.value + ' BPM', true);
    seqNextCycleTime = audioCtx.currentTime + SEQ_LOOKAHEAD;
    seqCycle();
  }

  function stopSequence(){
    seqPlaying = false;
    seqTimeoutIds.forEach(id => clearTimeout(id));
    seqTimeoutIds = [];
    const now = audioCtx ? audioCtx.currentTime : 0;
    seqActiveNodes.forEach(node => { try{ node.stop(now); }catch(e){} });
    seqActiveNodes = [];
    seqTrackEl.querySelectorAll('.seq-clip').forEach(el => el.classList.remove('active'));
    if(seqPlayheadRAF){ cancelAnimationFrame(seqPlayheadRAF); seqPlayheadRAF = null; }
    seqPlayheadEl.style.display = 'none';
    seqPlayBtn.textContent = '[▶ PLAY]';
    log('SEQ STOPPED', true);
  }

  seqPlayBtn.addEventListener('click', () => { seqPlaying ? stopSequence() : startSequence(); });

  // ---- ASCII dice ----
  const FACES = [
`┌───────┐
│       │
│   ●   │
│       │
└───────┘`,
`┌───────┐
│     ● │
│       │
│ ●     │
└───────┘`,
`┌───────┐
│     ● │
│   ●   │
│ ●     │
└───────┘`,
`┌───────┐
│ ●   ● │
│       │
│ ●   ● │
└───────┘`,
`┌───────┐
│ ●   ● │
│   ●   │
│ ●   ● │
└───────┘`,
`┌───────┐
│ ●   ● │
│ ●   ● │
│ ●   ● │
└───────┘`
  ];

  const diceFace = document.getElementById('dice-face');
  const dicePanel = document.getElementById('dice-panel');
  const diceHint = document.getElementById('dice-hint');
  let diceRolling = false;

  function renderFace(n){ diceFace.textContent = FACES[n - 1]; }
  renderFace(1);

  function rollDice(){
    if(diceRolling) return;
    diceRolling = true;
    diceFace.classList.add('rolling');
    diceHint.textContent = 'ROLLING...';
    playTone(320, 0.05, 0.1);

    let ticks = 0;
    const totalTicks = 14;
    function tick(){
      renderFace(1 + Math.floor(Math.random() * 6));
      ticks++;
      if(ticks < totalTicks){
        setTimeout(tick, 40 + ticks * 8);
      } else {
        const result = 1 + Math.floor(Math.random() * 6);
        renderFace(result);
        diceFace.classList.remove('rolling');
        diceHint.textContent = 'CLICK TO ROLL';
        diceRolling = false;
        playTone(140, 0.15, 0.15);
        log('DICE ROLLED: ' + result, true);
      }
    }
    tick();
  }

  dicePanel.addEventListener('click', rollDice);

  // Boot sequence
  log('WTS-BIOS (C) 2026 TRUEMORE');
  log('MEMORY TEST... 24 NOTES OK');
  log('CHORD ENGINE... LOADED');
  log('AUDIO ENGINE... STANDBY (TAP A NOTE TO INIT)');
})();
</script>
