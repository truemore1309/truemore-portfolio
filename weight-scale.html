<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>體重計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3a2361;
    --ink-soft:#6d4fa3;
    --ink-faint:#a693cf;
    --glass:rgba(255,255,255,.46);
    --glass-line:rgba(255,255,255,.75);
    --pink:#ff4fd8;
    --purple:#9b5cff;
    --blue:#4fc3f7;
    --cyan:#00e5ff;
    --mint:#2fc79a;
    --mint-deep:#1fa480;
    --needle:#ff2d55;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;padding:0;width:100%;min-height:100%;
    font-family:'Chewy',"Microsoft JhengHei","PingFang TC",-apple-system,sans-serif;
    background:
      radial-gradient(2px 2px at 10% 22%,#fff 45%,transparent 46%),
      radial-gradient(2px 2px at 82% 12%,#fff 45%,transparent 46%),
      radial-gradient(1.5px 1.5px at 52% 48%,#fff 45%,transparent 46%),
      radial-gradient(2px 2px at 28% 78%,#fff 45%,transparent 46%),
      radial-gradient(1.5px 1.5px at 92% 62%,#fff 45%,transparent 46%),
      radial-gradient(2px 2px at 64% 33%,#fff 45%,transparent 46%),
      radial-gradient(1.5px 1.5px at 14% 64%,#fff 45%,transparent 46%),
      radial-gradient(2px 2px at 44% 14%,#fff 45%,transparent 46%),
      linear-gradient(135deg,#ff8fe3 0%,#a06bff 35%,#5fb0ff 70%,#5cf0ff 100%);
    background-size:180px 180px,180px 180px,180px 180px,180px 180px,180px 180px,180px 180px,180px 180px,180px 180px,cover;
    background-attachment:fixed;
    color:var(--ink);
  }

  #background-container{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none}
  .bubble{
    position:absolute;bottom:-120px;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.85),rgba(255,255,255,.1));
    border-radius:50%;
    box-shadow:0 0 15px rgba(255,255,255,.5);
    border:1px solid rgba(255,255,255,.35);
    animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) scale(1);opacity:0}
    10%{opacity:.9}
    100%{transform:translateY(-120vh) scale(1.1);opacity:0}
  }

  .wrap{
    position:relative;z-index:10;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:96px 20px 56px;
  }
  .card{
    background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.78) 55%,rgba(235,224,255,.88));
    border:3px solid #fff;
    box-shadow:0 0 0 4px var(--pink),0 16px 40px rgba(120,40,200,.35),inset 0 3px 10px rgba(255,255,255,.9);
    border-radius:32px;
    padding:40px 32px;
    width:100%;max-width:460px;
    position:relative;overflow:hidden;
  }
  .card::before{
    content:'';position:absolute;top:-30%;left:-15%;width:130%;height:55%;
    background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0));
    border-radius:50%;pointer-events:none;
  }
  .fade-in{animation:fadeIn .5s cubic-bezier(.22,1,.36,1)}
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(18px) scale(.97)}
    to{opacity:1;transform:none}
  }

  .eyebrow{
    position:relative;display:table;margin:0 auto 14px;
    font-family:'Chewy',cursive;font-size:.78rem;font-weight:800;letter-spacing:.16em;
    color:#fff;text-transform:uppercase;
    background:linear-gradient(90deg,var(--pink),var(--purple));
    padding:6px 18px;border-radius:999px;
    box-shadow:0 3px 10px rgba(155,92,255,.4);
  }
  h1{
    position:relative;
    font-family:'Chewy',"Microsoft JhengHei","PingFang TC",cursive,sans-serif;
    font-weight:800;font-size:2rem;line-height:1.3;margin:0 0 26px;text-align:center;letter-spacing:-.01em;
    background:linear-gradient(90deg,var(--pink),var(--purple) 45%,var(--blue) 78%,var(--cyan));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 0 rgba(255,255,255,.7)) drop-shadow(0 6px 14px rgba(120,40,200,.25));
  }

  .field{margin-bottom:20px}
  .field label{
    display:block;font-family:'Chewy',cursive;font-weight:700;
    font-size:.9rem;color:var(--ink-soft);margin-bottom:8px;letter-spacing:.03em;text-align:center;
  }
  .field input{
    width:100%;padding:14px 14px;border-radius:999px;
    border:2px solid var(--purple);
    background:linear-gradient(180deg,#fff,#f4ecff);
    font-family:'Orbitron',sans-serif;font-size:1.3rem;font-weight:700;color:var(--ink);
    outline:none;transition:.2s;text-align:center;
    box-shadow:inset 0 2px 4px rgba(120,40,200,.12),0 2px 0 rgba(255,255,255,.8);
  }
  .field input:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,79,216,.25),inset 0 2px 4px rgba(120,40,200,.12)}
  .field-error{
    color:#ff2d78;font-size:.86rem;line-height:1.6;margin:-10px 0 18px;
    text-align:center;display:none;font-weight:700;
  }
  .field-error.show{display:block}

  .cta-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
  .btn{
    flex:1 1 170px;max-width:280px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#baf0ff 0%,#4fc3f7 45%,#2196d8 55%,#1c86c4 100%);
    color:#06304a;
    border:2px solid #fff;
    padding:16px 22px;border-radius:999px;
    font-family:'Chewy',cursive;font-size:1rem;font-weight:800;
    cursor:pointer;transition:.15s;
    box-shadow:0 4px 0 #1c7fb8,0 8px 18px rgba(30,140,220,.4),inset 0 2px 3px rgba(255,255,255,.9);
  }
  .btn::before{
    content:'';position:absolute;top:8%;left:8%;width:84%;height:38%;
    background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));
    border-radius:50%;pointer-events:none;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #1c7fb8,0 12px 22px rgba(30,140,220,.5),inset 0 2px 3px rgba(255,255,255,.9)}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1c7fb8,inset 0 2px 3px rgba(255,255,255,.9)}
  .btn.ghost{
    background:linear-gradient(180deg,#ffd6f7 0%,#ff8fe3 45%,#ff5fc4 55%,#e83fae 100%);
    color:#5a0e46;
    box-shadow:0 4px 0 #c22f92,0 8px 18px rgba(255,95,196,.35),inset 0 2px 3px rgba(255,255,255,.85);
  }
  .btn.ghost:hover{box-shadow:0 6px 0 #c22f92,0 12px 22px rgba(255,95,196,.45),inset 0 2px 3px rgba(255,255,255,.85)}
  .btn.ghost:active{box-shadow:0 2px 0 #c22f92,inset 0 2px 3px rgba(255,255,255,.85)}

  /* --- 轉盤體重計：指針固定，錶面（刻度盤）在窗口後面轉動 --- */
  .scale-status{text-align:center;font-size:.92rem;color:var(--ink-soft);margin:0 0 18px;min-height:1.4em}
  .scale-case{
    width:100%;max-width:300px;margin:0 auto;padding:20px;border-radius:28px;
    background:linear-gradient(135deg,#eef0ff,#dfe6ff 40%,#ffe3fb 70%,#e0faff 100%);
    box-shadow:0 14px 30px rgba(120,40,200,.28),0 0 0 4px #fff,0 0 0 7px var(--purple),
      inset 0 4px 8px rgba(255,255,255,.9);
  }
  .scale-window{
    position:relative;height:168px;border-radius:16px;overflow:hidden;
    background:#fdfdfd;border:3px solid #d7dadc;
    box-shadow:inset 0 8px 16px rgba(0,0,0,.12);
  }
  .scale-window::after{
    content:'';position:absolute;inset:0;z-index:13;pointer-events:none;
    background:linear-gradient(120deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 38%);
  }
  .fixed-needle{
    position:absolute;left:50%;top:10px;width:3px;height:90px;
    background:var(--needle);transform:translateX(-50%);
    box-shadow:1px 1px 3px rgba(0,0,0,.25);z-index:10;
  }
  .needle-base{
    position:absolute;left:50%;bottom:0;width:92px;height:30px;
    background:#e9ebec;border-radius:60px 60px 0 0;
    transform:translateX(-50%);box-shadow:0 -3px 6px rgba(0,0,0,.08);z-index:11;
  }
  .capacity-label{
    position:absolute;bottom:12px;left:0;right:0;text-align:center;
    font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.06em;
    color:#8a7aa8;z-index:12;
  }
  .dial-wrapper{position:absolute;left:50%;top:42px}
  .dial{
    position:absolute;width:420px;height:420px;left:-210px;top:0;border-radius:50%;
    transition:transform 2s cubic-bezier(.22,1,.36,1);
  }
  .tick{position:absolute;left:50%;top:0;transform:translateX(-50%);background:#3c454a}
  .tick.major{width:3px;height:20px}
  .tick.minor{width:1.5px;height:10px;opacity:.55}
  .tick-num{
    position:absolute;left:50%;top:27px;transform:translateX(-50%);
    font-family:'Orbitron',sans-serif;font-weight:700;color:#2c3438;
    font-size:19px;white-space:nowrap;
  }
  /* 三位數比兩位數寬很多，縮小字級並收一點字距，才不會跟隔壁刻度擠在一起 */
  .tick-num.triple{font-size:14px;top:29px;letter-spacing:-.02em}

  .result-box{text-align:center;margin-top:22px}
  .result-num{
    font-family:'Orbitron',sans-serif;font-weight:700;
    font-size:clamp(38px,10vw,52px);
    background:linear-gradient(90deg,var(--purple),var(--pink) 50%,var(--blue));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 0 rgba(255,255,255,.7));
    opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease;
  }
  .result-num.show{opacity:1;transform:none}
  .result-num .unit{
    font-size:.42em;font-weight:400;margin-left:4px;
    -webkit-text-fill-color:var(--ink-soft);color:var(--ink-soft);
  }

  .home-btn{
    position:fixed;top:26px;left:26px;z-index:100;
    padding:12px 22px;
    background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.6));
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:2px solid #fff;
    border-radius:99px;
    color:#6b2fa8;font-family:'Chewy',cursive;font-weight:700;font-size:.85rem;
    text-decoration:none;letter-spacing:.05em;
    transition:background .3s,color .3s,transform .3s;
    animation:home-btn-flash 3s ease-in-out infinite;
  }
  .home-btn:hover{background:linear-gradient(180deg,#fff,#ffe3fb);transform:translateX(-3px);color:var(--pink)}
  @keyframes home-btn-flash{
    0%,80%,100%{box-shadow:0 0 0 2px var(--purple),0 4px 14px rgba(120,40,200,.25)}
    86%,90%{box-shadow:0 0 0 5px #fff,0 0 0 9px var(--pink),0 0 36px 14px rgba(255,79,216,.95)}
    93%{box-shadow:0 0 0 2px var(--purple),0 4px 14px rgba(120,40,200,.25)}
    96%,99%{box-shadow:0 0 0 5px #fff,0 0 0 9px var(--pink),0 0 36px 14px rgba(255,79,216,.95)}
  }

  .sparkle{position:fixed;pointer-events:none;z-index:9999;animation:sparkle-fade .7s ease-out forwards}
  @keyframes sparkle-fade{
    0%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0deg)}
    100%{opacity:0;transform:translate(-50%,-80%) scale(.4) rotate(45deg)}
  }

  @media (max-width:520px){
    .wrap{padding:82px 14px 44px}
    .card{padding:28px 20px;border-radius:22px}
    h1{font-size:1.5rem}
    .home-btn{top:14px;left:14px;padding:9px 16px;font-size:.78rem}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;transition-duration:.01ms!important}
    .dial{transition:none}
  }
</style>
</head>
<body>

<div id="background-container"></div>

<a href="index.html" class="home-btn">← BACK TO TRUEMORE</a>

<div class="wrap">
  <div id="card" class="card fade-in"></div>
</div>

<script>
(function(){
  // ---- 背景泡泡 ----
  const bgContainer = document.getElementById('background-container');
  for(let i = 0; i < 22; i++){
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = Math.random() * 70 + 18;
    b.style.width = b.style.height = size + 'px';
    b.style.left = (Math.random() * 100) + '%';
    b.style.animationDuration = (Math.random() * 8 + 6) + 's';
    b.style.animationDelay = (Math.random() * 5) + 's';
    bgContainer.appendChild(b);
  }

  const MAX_CAPACITY = 130; // 轉盤的滿刻度（公斤）

  const card = document.getElementById('card');
  let desired = 60;

  function swap(build){
    card.innerHTML = '';
    card.classList.remove('fade-in');
    void card.offsetWidth;
    card.classList.add('fade-in');
    build();
  }

  function el(tag, cls, html){
    const n = document.createElement(tag);
    if(cls) n.className = cls;
    if(html !== undefined) n.innerHTML = html;
    return n;
  }

  // ---- 開場：輸入你想要的體重 ----
  function renderIntro(){
    swap(() => {
      card.appendChild(el('div','eyebrow','✨ SCALE ✨'));
      card.appendChild(el('h1','','體重計'));

      const field = el('div','field');
      field.appendChild(el('label','','你的體重'));
      const input = document.createElement('input');
      input.type = 'number'; input.step = '0.1'; input.value = desired;
      field.appendChild(input);
      card.appendChild(field);

      const error = el('div','field-error','請輸入大於 0 的數字。');
      card.appendChild(error);

      const cta = el('div','cta-row');
      const start = el('button','btn','站上去 →');
      start.onclick = () => {
        const v = parseFloat(input.value);
        if(!Number.isFinite(v) || v <= 0){
          error.classList.add('show');
          return;
        }
        error.classList.remove('show');
        desired = v;
        renderResult();
      };
      cta.appendChild(start);
      card.appendChild(cta);
    });
  }

  // 產生會轉動的大轉盤：每一格刻度包在自己的角度容器裡，數字直接跟著容器轉，
  // 靠外層 .dial 反向轉動，讓目標刻度轉到正上方時，數字剛好轉回正的
  function buildDial(){
    const dial = el('div','dial');
    const degPerKg = 360 / MAX_CAPACITY;

    for(let i = 0; i < MAX_CAPACITY; i++){
      const wrap = document.createElement('div');
      wrap.style.position = 'absolute';
      wrap.style.inset = '0';
      wrap.style.transform = 'rotate(' + (i * degPerKg) + 'deg)';

      const isMajor = i % 5 === 0;
      wrap.appendChild(el('div','tick ' + (isMajor ? 'major' : 'minor')));

      if(isMajor){
        wrap.appendChild(el('div','tick-num' + (i >= 100 ? ' triple' : ''), i));
      }
      dial.appendChild(wrap);
    }
    return dial;
  }

  // ---- 結果：指針掃到目標值後停住 ----
  function renderResult(){
    const overCap = desired > MAX_CAPACITY;
    // 在想要的體重上加一點點誤差，看起來才像真的量出來的；超過上限指針就卡死在 0
    const dialTarget = overCap
      ? 0
      : Math.min(MAX_CAPACITY, Math.max(0, desired + (Math.random() * 0.8 - 0.4)));

    swap(() => {
      const status = el('div','scale-status','測量中…');
      card.appendChild(status);

      const shell = el('div','scale-case');
      const win = el('div','scale-window');
      win.appendChild(el('div','fixed-needle'));
      win.appendChild(el('div','needle-base'));
      win.appendChild(el('div','capacity-label', MAX_CAPACITY + 'kg x 1kg'));

      const dialWrapper = el('div','dial-wrapper');
      const dial = buildDial();
      dialWrapper.appendChild(dial);
      win.appendChild(dialWrapper);

      shell.appendChild(win);
      card.appendChild(shell);

      const resultBox = el('div','result-box');
      const num = el('div','result-num', '-- <span class="unit">kg</span>');
      resultBox.appendChild(num);
      card.appendChild(resultBox);

      const cta = el('div','cta-row');
      const again = el('button','btn','再站一次');
      again.onclick = renderResult;
      const reset = el('button','btn ghost','換個體重');
      reset.onclick = renderIntro;
      cta.appendChild(again);
      cta.appendChild(reset);
      card.appendChild(cta);

      // 指針固定，轉盤反向轉動，讓目標數字轉到指針指的正上方
      const angle = -(dialTarget / MAX_CAPACITY) * 360;
      requestAnimationFrame(() => {
        dial.style.transform = 'rotate(' + angle + 'deg)';
      });

      setTimeout(() => {
        status.textContent = '';
        const shown = overCap ? desired : dialTarget;
        num.innerHTML = shown.toFixed(1) + ' <span class="unit">kg</span>';
        num.classList.add('show');
      }, 2100);

      card.scrollIntoView({ block:'start', behavior:'smooth' });
    });
  }

  renderIntro();

  // ---- Y2K 滑鼠亮片尾巴 ----
  (function initSparkleTrail(){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if(matchMedia('(pointer: coarse)').matches) return; // 觸控裝置沒有游標可以拖亮片
    const colors = ['#ff4fd8','#9b5cff','#4fc3f7','#c6ff4d','#ffe14f'];
    let last = 0;
    document.addEventListener('mousemove', (e) => {
      const now = Date.now();
      if(now - last < 40) return; // 節流，避免亮片洗版
      last = now;
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.textContent = '✦';
      s.style.left = e.clientX + 'px';
      s.style.top = e.clientY + 'px';
      s.style.fontSize = (10 + Math.random() * 10) + 'px';
      s.style.color = colors[Math.floor(Math.random() * colors.length)];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 700);
    }, { passive: true });
  })();
})();
</script>
</body>
</html>
